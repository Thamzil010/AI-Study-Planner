version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ai_study_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_study_planner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_study_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # backend:
